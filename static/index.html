<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测试用例执行器</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand">测试用例执行器</span>
      <span id="fileName" class="file-name"></span>
    </div>
    <div class="topbar-right">
      <span id="sessionInfo" class="session-info"></span>
      <span id="execControls" class="exec-controls">
        <button id="changeFile" class="btn btn-ghost" title="返回初始页更换用例">更换用例</button>
        <button id="viewToggle" class="btn btn-ghost" title="切换测试详情 / 执行界面">测试详情</button>
        <button id="tableToggle" class="btn btn-ghost" title="切换 表格视图 / 卡片视图">表格视图</button>
        <select id="roundSelect" class="sheet-select round-select" title="选择本轮测试结果写入列"></select>
        <button id="newRoundBtn" class="btn btn-ghost" title="在所有用例 Sheet 新建结果列（开启新一轮测试）">＋新建列</button>
        <button id="filterToggle" class="btn btn-ghost" title="筛选用例（激活后仅执行匹配的用例）">筛选</button>
        <select id="sheetFilter" class="sheet-select" title="按模块跳转"></select>
        <button id="jumpNext" class="btn btn-ghost" title="跳到下一条未完成">下一条未测</button>
        <a id="downloadBtn" class="btn btn-ghost" href="/api/download">下载 Excel</a>
        <span id="saveStatus" class="save-status"></span>
      </span>
    </div>
  </header>

  <!-- 进度条（初始页隐藏） -->
  <div id="progressWrap" class="progress-wrap">
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <span id="progressText" class="progress-text">0 / 0</span>
  </div>

  <!-- 筛选面板（激活后全局工作集收窄：导航/进度/表格/详情只作用于匹配用例） -->
  <section id="filterPanel" class="filter-panel hidden">
    <div class="filter-row">
      <label class="filter-group filter-kw">
        <span class="filter-group-label">关键词</span>
        <input id="filterKeyword" class="field-input filter-input" type="text"
               placeholder="编号 / 标题 / 模块 / 步骤 / 备注…" />
      </label>
      <label class="filter-group">
        <span class="filter-group-label">编号范围</span>
        <span class="filter-id-range">
          <input id="filterIdFrom" class="field-input filter-input filter-id" type="text" placeholder="起 如 1" />
          <span class="filter-id-sep">—</span>
          <input id="filterIdTo" class="field-input filter-input filter-id" type="text" placeholder="止 如 50" />
        </span>
      </label>
    </div>
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-group-label">状态</span>
        <span id="filterStatuses" class="filter-chips"></span>
      </div>
      <label class="filter-group">
        <span class="filter-group-label">参照列</span>
        <select id="filterRefCol" class="sheet-select filter-ref" title="状态筛选依据哪个结果列判断"></select>
      </label>
    </div>
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-group-label">优先级</span>
        <span id="filterPriorities" class="filter-chips"></span>
      </div>
      <div class="filter-group">
        <span class="filter-group-label">风险</span>
        <span id="filterRisks" class="filter-chips"></span>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-group-label">模块</span>
        <span id="filterModules" class="filter-chips"></span>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-group-label">Sheet</span>
        <span id="filterSheets" class="filter-chips"></span>
      </div>
    </div>
    <div class="filter-row filter-row-bottom">
      <div class="filter-group">
        <span class="filter-group-label">预设</span>
        <span id="filterPresets" class="filter-chips"></span>
      </div>
      <span class="filter-actions">
        <button id="filterSaveBtn" class="btn btn-ghost btn-small">保存为预设</button>
        <button id="filterClearBtn" class="btn btn-ghost btn-small">清除全部</button>
        <span id="filterCount" class="filter-count"></span>
      </span>
    </div>
  </section>

  <!-- 主内容 -->
  <main id="main" class="main">
    <!-- 加载态 -->
    <section id="loader" class="loader">正在加载…</section>

    <!-- 初始配置页 -->
    <section id="setupView" class="setup-view hidden">
      <h1 class="setup-title">开始测试</h1>
      <p class="setup-sub">配置本次测试信息，选择用例文件后开始执行。</p>

      <div class="setup-grid">
        <label class="field">
          <span class="field-label">测试阶段</span>
          <input id="stageInput" class="field-input" type="text" placeholder="如：冒烟测试 / 回归测试 / 验收测试" />
        </label>
        <label class="field">
          <span class="field-label">测试人员</span>
          <input id="testerInput" class="field-input" type="text" placeholder="你的名字" />
        </label>
      </div>

      <div class="setup-files-head">
        <span class="field-label">测试用例文件</span>
        <div class="setup-files-actions">
          <button id="uploadBtn" class="btn btn-ghost btn-small">上传 / 更换文件</button>
          <input id="uploadInput" type="file" accept=".xlsx,.xlsm,.xls,.csv,.md,.xmind" class="hidden" />
        </div>
      </div>
      <div id="fileList" class="file-list"></div>
      <div id="setupHint" class="setup-hint"></div>

      <button id="startBtn" class="btn btn-start" disabled>开始测试</button>
    </section>

    <!-- 用例卡片（功能 / 场景通用，由 JS 控制分区显隐） -->
    <section id="card" class="card hidden">
      <div class="card-head">
        <div class="badges">
          <span id="caseId" class="badge badge-id"></span>
          <span id="kindTag" class="badge badge-kind"></span>
          <span id="priority" class="badge"></span>
          <span id="risk" class="badge"></span>
          <span id="moduleTag" class="badge badge-module"></span>
        </div>
        <h1 id="title" class="case-title"></h1>
        <div id="scenario" class="case-scenario"></div>
      </div>

      <div id="preconditionSection" class="section">
        <h2 class="section-title">前置条件</h2>
        <div id="precondition" class="section-body"></div>
      </div>

      <!-- 场景讲解（仅场景用例显示）：图文混排信息卡片，可折叠 -->
      <div id="scenarioSection" class="section scene-card hidden">
        <button id="sceneToggle" class="scene-head" type="button" title="展开 / 收起场景讲解">
          <span class="scene-icon">🎬</span>
          <h2 class="section-title">场景讲解</h2>
          <span id="sceneArrow" class="scene-arrow">▲</span>
        </button>
        <div id="sceneBody" class="scene-body">
          <div id="sceneDesc" class="scene-desc"></div>
          <div id="scenarioImages" class="scene-images"></div>
        </div>
      </div>

      <div id="stepsSection" class="section">
        <h2 class="section-title">测试步骤</h2>
        <ol id="steps" class="steps-list"></ol>
      </div>

      <div id="expectedSection" class="section">
        <h2 class="section-title">预期结果</h2>
        <div id="expected" class="section-body expected"></div>
      </div>

      <!-- 附加信息（未识别为核心字段的额外列，只读） -->
      <div id="extrasSection" class="section hidden">
        <h2 class="section-title">附加信息</h2>
        <div id="extras" class="extras-list"></div>
      </div>

      <!-- 执行区 -->
      <div class="exec">
        <h2 class="section-title">执行结果</h2>
        <div class="result-buttons" id="resultButtons">
          <button class="rbtn rbtn-pass" data-result="PASS">通过 <kbd>1</kbd></button>
          <button class="rbtn rbtn-fail" data-result="FAIL">失败 <kbd>2</kbd></button>
          <button class="rbtn rbtn-block" data-result="BLOCK">阻塞 <kbd>3</kbd></button>
          <button class="rbtn rbtn-na" data-result="NA">跳过 <kbd>4</kbd></button>
        </div>

        <label class="field">
          <span class="field-label">实际现象 / 结果</span>
          <textarea id="actual" class="field-input" rows="3" placeholder="记录实际观察到的现象或结果…"></textarea>
        </label>

        <div class="field-row">
          <label class="field field-time">
            <span class="field-label">发现时间</span>
            <div class="time-row">
              <input id="foundTime" class="field-input" type="text" placeholder="点击记录或手动输入 (YYYY-MM-DD HH:mm:ss)" />
              <button id="stampBtn" class="btn btn-small">记录当前时间</button>
              <button id="clearTimeBtn" class="btn btn-small btn-ghost">清除</button>
            </div>
          </label>
        </div>

        <div class="field-row two-col">
          <label class="field">
            <span class="field-label">BugID</span>
            <input id="bugId" class="field-input" type="text" placeholder="关联缺陷编号" />
          </label>
          <label class="field">
            <span class="field-label">测试人员</span>
            <input id="tester" class="field-input" type="text" placeholder="你的名字" />
          </label>
        </div>

        <label class="field">
          <span class="field-label">备注 / 问题描述</span>
          <textarea id="note" class="field-input" rows="2" placeholder="补充说明或问题描述…"></textarea>
        </label>
      </div>
    </section>

    <!-- 筛选空态（当前筛选条件下无匹配用例） -->
    <section id="filterEmpty" class="loader hidden">当前筛选条件下无匹配用例，请调整或清除筛选条件。</section>

    <!-- 表格视图（当前 Sheet 用例总览，结果列可行内标记） -->
    <section id="tableView" class="table-view hidden">
      <div class="table-head">
        <h1 id="tableTitle" class="table-title"></h1>
        <div id="tableSummary" class="table-summary"></div>
      </div>
      <div id="tableWrap" class="case-table-wrap"></div>
    </section>

    <!-- 测试详情页（按 Sheet 分组，由 JS 渲染填充） -->
    <section id="detailView" class="detail-view hidden">
      <div class="detail-head">
        <h1 class="detail-title">测试详情</h1>
        <div id="detailSummary" class="detail-summary"></div>
      </div>
      <div id="sheetGroups" class="sheet-groups"></div>
    </section>

    <!-- 只读预览页（矩阵 / 信息页，由 JS 渲染填充） -->
    <section id="previewView" class="preview-view hidden">
      <div class="preview-head">
        <button id="previewBack" class="btn btn-ghost btn-small">← 返回详情</button>
        <h1 id="previewTitle" class="preview-title"></h1>
      </div>
      <div id="previewBody" class="preview-body"></div>
    </section>
  </main>

  <!-- 底部导航 -->
  <footer id="navbar" class="navbar">
    <button id="prevBtn" class="btn btn-nav">← 上一条 <kbd>←</kbd></button>
    <span id="navCounter" class="nav-counter">- / -</span>
    <button id="nextBtn" class="btn btn-nav">下一条 → <kbd>→</kbd></button>
  </footer>

  <!-- 图片灯箱（点击示意图放大预览） -->
  <div id="lightbox" class="lightbox hidden">
    <button id="lbClose" class="lb-btn lb-close" title="关闭 (Esc)">×</button>
    <button id="lbPrev" class="lb-btn lb-prev" title="上一张 (←)">‹</button>
    <img id="lbImg" class="lb-img" alt="示意图预览" />
    <button id="lbNext" class="lb-btn lb-next" title="下一张 (→)">›</button>
    <span id="lbCounter" class="lb-counter"></span>
  </div>

  <!-- 聚焦阅读侧栏（表格长文本全文深读，单焦点） -->
  <div id="readerMask" class="reader-mask hidden"></div>
  <aside id="readerPanel" class="reader-panel hidden" aria-label="全文阅读">
    <div class="reader-head">
      <div class="reader-meta">
        <span id="readerCol" class="reader-col"></span>
        <span id="readerRow" class="reader-row"></span>
      </div>
      <button id="readerClose" class="lb-btn reader-close" title="关闭 (Esc)">×</button>
    </div>
    <div id="readerBody" class="reader-body"></div>
  </aside>

  <script src="/static/app.js"></script>
</body>
</html>
